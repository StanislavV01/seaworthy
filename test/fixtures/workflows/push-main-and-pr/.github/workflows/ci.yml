name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install
      - run: npm run lint
      # next build also runs the TypeScript check
      - run: npm run build
      - name: e2e
        run: |
          npx playwright install
          npm run e2e
